<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Momentum · Sign in</title><link rel="stylesheet" href="/welcome.css"><link rel="icon" href="/icon-192.png"><script src="/cloudflare-login.js" defer></script></head><body><header><a class="brand" href="/">✦ Money Momentum</a><a href="/demo">Try the demo →</a></header><main style="max-width:560px;margin-top:30px"><p class="eyebrow">YOUR PRIVATE MONEY PLANNER</p><h1 style="font-size:48px">Welcome back.</h1><p class="intro">Your accounts. Your plans. Your next move.</p><section><button class="button" id="googleLogin" type="button" style="width:100%" disabled>Continue with Google</button><p style="text-align:center;width:100%;color:#aaaec7">or use your email</p><form id="emailForm" style="width:100%;display:grid;gap:12px"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required maxlength="254" style="padding:13px;border-radius:10px;border:1px solid #505773;font:inherit" disabled><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="128" style="padding:13px;border-radius:10px;border:1px solid #505773;font:inherit" disabled><button class="button" id="emailSubmit" disabled>Sign in</button></form><button class="login" id="resetPassword" type="button" style="margin-top:16px;background:none;border:0;cursor:pointer" disabled>Forgot password?</button><button class="login" id="switchMode" type="button" style="margin-top:16px;background:none;border:0;cursor:pointer" disabled>New here? Create an account</button><p id="loginStatus" role="status" aria-live="polite">Loading sign-in…</p><p class="note">Email accounts require verification before your private planner opens. Your financial records are visible only in your own account.</p></section></main></body></html>
